# ─────────────────────────────────────────────────────────────────
# PayWave — ShardingSphere config
#
# On LOCAL:  SHARD_HOST / SHARD_PASSWORD not set → uses fallback values
#            (localhost, @Sheemab786) — works as before
#
# On DOCKER: env vars injected by docker-compose → uses container names
#            (mysql-shard-1, mysql-shard-2)
# ─────────────────────────────────────────────────────────────────

# 🔹 1️⃣ Physical data sources
dataSources:
  shardwallet1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://mysql-shard-1:3306/shardwallet1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "@Sheemab786"

  shardwallet2:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://mysql-shard-2:3306/shardwallet2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "@Sheemab786"

# 🔹 2️⃣ Sharding rules
rules:
  - !SHARDING

    defaultDatabaseStrategy:
      standard:
        shardingColumn: id
        shardingAlgorithmName: db-inline

    tables:
      users:
        actualDataNodes: shardwallet${1..2}.users
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake

      wallets:
        actualDataNodes: shardwallet${1..2}.wallets
        databaseStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: db-inline-user-id
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake

      transactions:
        actualDataNodes: shardwallet${1..2}.transactions
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake

      saga_steps:
        actualDataNodes: shardwallet${1..2}.saga_steps
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake

      saga_instances:
        actualDataNodes: shardwallet${1..2}.saga_instances
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: db-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake

      idempotency_records:
        actualDataNodes: shardwallet1.idempotency_records

    shardingAlgorithms:
      db-inline:
        type: INLINE
        props:
          algorithm-expression: shardwallet${Math.abs(id.hashCode()) % 2 + 1}

      db-inline-user-id:
        type: INLINE
        props:
          algorithm-expression: shardwallet${Math.abs(user_id.hashCode()) % 2 + 1}

    keyGenerators:
      snowflake:
        type: SNOWFLAKE

props:
  sql-show: true





