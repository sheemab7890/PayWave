services:

  mysql:
    image: mysql:8.4
    container_name: mysql

    restart: unless-stopped

    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=30

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

    networks:
      - paywave-net

  app:
    image: sheemab7890/paywave:latest
    container_name: paywave-app

    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      SHARD1_HOST: mysql
      SHARD1_PORT: 3306

      SHARD2_HOST: mysql
      SHARD2_PORT: 3306

      SHARD_USERNAME: root
      SHARD_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000

      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

    ports:
      - "8080:8080"

    networks:
      - paywave-net

networks:
  paywave-net:

volumes:
  mysql_data:


